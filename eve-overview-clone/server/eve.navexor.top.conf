# EVE 市场工具静态站（v2）
# 部署到 /etc/nginx/sites-available/eve.navexor.top
server {
    listen 80;
    listen [::]:80;
    server_name eve.navexor.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eve.navexor.top;

    ssl_certificate /etc/letsencrypt/live/eve.navexor.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eve.navexor.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ESI 辅助服务：公开的应用配置与玩家建筑名称缓存（令牌由浏览器直接向 CCP 获取，不经过这里）
    location /api/esi/ {
        proxy_pass http://127.0.0.1:8290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # 击杀记录服务（kb_service.py）：只读接口
    location /api/kb/ {
        proxy_pass http://127.0.0.1:8291;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        gzip on;
    }

    # 开放 API（kb_service.py /api/v1/）：只读、允许跨域，按 X-Real-IP 每 IP 每分钟 1000 次；文档 /api.html
    location /api/v1 {
        proxy_pass http://127.0.0.1:8291;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        gzip on;
    }

    root /opt/eve/dist;
    index index.html;

    # 回调地址可能带 code/state，入口页保持协商缓存，避免缓存授权参数。
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # index-v2.html 使用版本号查询参数；静态资源可长期缓存。
    location ~* \.(js|css|json|png|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
}
