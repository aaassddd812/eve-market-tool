<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml">
  <title>悬浮窗 · EVE</title>
  <!-- 悬浮窗（击杀预警 / 到价提醒 / 本地红名 / 日志预警 / 频道翻译）：桌面版的原生置顶窗口、网页画中画里的 iframe 都加载这个页面，内容由主页面推过来（js/float-feed.js、js/float-view.js） -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('eve-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      // 新页面（「EVE 风格」界面，个性化设置）：中文字体 MiSans（正文）、得意黑（大标题）只在开启时加载（切片字体，只下载页面用到的字）
      try {
        if ((JSON.parse(localStorage.getItem('eve-prefs') || '{}') || {}).skin !== 'default') {   // 默认就是新页面，只有在设置里关掉（skin = default）才用老界面
          document.documentElement.setAttribute('data-skin', 'eve');
          if (localStorage.getItem('eve-theme') !== 'light') document.documentElement.setAttribute('data-theme', 'dark');   // 这套界面默认深色，不跟随系统浅色；手动切过浅色的保留
          document.write('<link rel="stylesheet" id="misansCss" href="assets/fonts/misans/MiSansVF.min.css"><link rel="stylesheet" href="assets/fonts/smiley/smiley-sans.css">');
        }
      } catch (e) {}
    })();
  </script>
  <style>html.i18n-pending body { visibility: hidden; }</style>
  <script src="js/i18n.js?v=305"></script>
  <!-- 连不上官方 ESI 时自动走本站中转（js/esi-relay.js） -->
  <script src="js/esi-relay.js?v=2"></script>
  <link rel="stylesheet" href="css/float.css?v=v8">
</head>
<body>
  <div class="fl" id="fl">
    <header class="fl-head" id="flHead">
      <span class="fl-title" id="flTitle"></span>
      <div class="fl-tabs" id="flTabs" hidden></div>
      <span class="fl-sp"></span>
      <button type="button" class="fl-btn" data-fl-zoom title="缩放（也可以 Ctrl + 滚轮）" aria-label="缩放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg></button>
      <div class="fl-ctl" id="flCtl" hidden>
        <button type="button" class="fl-btn" data-fl-alpha title="透明度" aria-label="透明度"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
        <button type="button" class="fl-btn" data-fl-pass title="鼠标穿透：点击直接落到下面的游戏上（在主窗口再点一次「悬浮窗」恢复）" aria-label="鼠标穿透"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 4 7 16 2.5-6.5L20 11z"/></svg></button>
        <button type="button" class="fl-btn" data-fl-close title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </header>
    <main class="fl-body" id="flBody"></main>
    <footer class="fl-foot" id="flFoot"></footer>
  </div>
  <script type="module" src="js/float-view.js?v=v12"></script>
</body>
</html>
