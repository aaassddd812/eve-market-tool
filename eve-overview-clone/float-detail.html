<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml">
  <title>详情 · EVE</title>
  <!-- 悬浮窗里点开的物品 / 击杀详情：桌面版另开一个置顶窗口加载这个页面，网页画中画里叠在悬浮窗上面（iframe）；内容由主页面生成（js/float-detail.js） -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('eve-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      // 新页面（「EVE 风格」界面，个性化设置）：中文字体 MiSans（正文）、得意黑（大标题）只在开启时加载（切片字体，只下载页面用到的字）
      try {
        if ((JSON.parse(localStorage.getItem('eve-prefs') || '{}') || {}).skin !== 'default') {   // 默认就是新页面，只有在设置里关掉（skin = default）才用老界面
          document.documentElement.setAttribute('data-skin', 'eve');
          if (localStorage.getItem('eve-theme') !== 'light') document.documentElement.setAttribute('data-theme', 'dark');   // 这套界面默认深色，不跟随系统浅色；手动切过浅色的保留
          document.write('<link rel="stylesheet" id="misansCss" href="assets/fonts/misans/MiSansVF.min.css"><link rel="stylesheet" href="assets/fonts/smiley/smiley-sans.css">');
        }
      } catch (e) {}
    })();
  </script>
  <style>html.i18n-pending body { visibility: hidden; }</style>
  <script src="js/i18n.js?v=378"></script>
  <!-- 连不上官方 ESI 时自动走本站中转（js/esi-relay.js） -->
  <script src="js/esi-relay.js?v=2"></script>
  <link rel="stylesheet" href="css/modern-style.css?v=v447">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg-primary); }
    .fd { display: flex; flex-direction: column; height: 100%; }
    .fd-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px; flex: none; background: var(--bg-secondary); }
    .fd-head h1 { flex: 1; min-width: 0; margin: 0 4px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fd-head .icon-btn { width: 28px; height: 28px; flex: none; }
    html.fd-native .fd-head { cursor: move; }
    .fd-head .icon-btn svg { width: 16px; height: 16px; }
    .fd-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
    .fd-msg { margin: 24px 0; text-align: center; color: var(--text-muted); font-size: 0.8125rem; }
    /* 物品详情：整页显示，标签页下面的内容随页面滚动 */
    .fi-float { width: auto; height: auto; }
    .fi-float .fi-panes { margin: 0; padding: 0; overflow: visible; }
    .fi-float .fi-head img { width: 56px; height: 56px; }
    /* 击杀详情（killboard.js renderKillFloat）：头部压成几行，先看攻击者（哪些军团 / 联盟、开什么船），装配与物品在第二个标签 */
    .kbf-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .kbf-ship { border-radius: 8px; background: var(--bg-tertiary); }
    .kbf-who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .kbf-who b, .kbf-who small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kbf-who b { font-size: 0.9375rem; }
    .kbf-who small { color: var(--text-muted); font-size: 0.75rem; }
    .kbf-val { text-align: right; white-space: nowrap; }
    .kbf-val b { font-size: 1.125rem; font-variant-numeric: tabular-nums; }
    .kbf-val small { margin-left: 3px; color: var(--text-muted); font-size: 0.6875rem; }
    .kbf-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; margin-top: 8px; color: var(--text-secondary); font-size: 0.75rem; }
    .kbf-sum { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--bg-secondary); }
    .kbf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 0.75rem; }
    .kbf-row em { margin-right: 2px; font-style: normal; color: var(--text-muted); }
    .kbf-chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0; padding: 2px 6px; border-radius: 6px; background: var(--bg-tertiary); }
    .kbf-chip > span, .kbf-chip > a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kbf-chip img { flex: none; border-radius: 3px; }
    .kbf-chip b { flex: none; color: var(--text-secondary); font-weight: 600; }
    .kbf-more { color: var(--text-muted); }
    .kbf .kb-tabs { margin: 12px 0 8px; }
    /* 攻击者名字太长时省略名字，「最后一击」标签留着 */
    .kbf .kb-attacker-main strong { display: flex; align-items: center; min-width: 0; }
    .kbf .kb-attacker-main strong > a { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .kbf .kb-attacker-main strong > .kb-tag { flex: none; }
    .kbf-values { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .kbf-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    /* 人物详情 */
    .kb-float .kb-entity-head { flex-wrap: wrap; gap: 12px; }
    .kb-float .kb-entity-head img { width: 56px; height: 56px; }
    .kb-float .kb-entity-head h2 { font-size: 1.125rem; }
    .kb-float .valuation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kb-float .kb-mini-grid, .kb-float .kb-activity { grid-template-columns: 1fr; }
  </style>
</head>
<body>
  <div class="fd">
    <header class="fd-head">
      <button type="button" class="icon-btn" id="fdBack" data-fd-back title="返回" aria-label="返回" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <h1 id="fdTitle">详情</h1>
      <button type="button" class="icon-btn" data-fd-main title="在主窗口打开" aria-label="在主窗口打开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      <button type="button" class="icon-btn" id="fdClose" data-fd-close title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </header>
    <main class="fd-body" id="fdBody"><p class="fd-msg">读取中…</p></main>
  </div>
  <script type="module" src="js/float-detail.js?v=v3"></script>
</body>
</html>
