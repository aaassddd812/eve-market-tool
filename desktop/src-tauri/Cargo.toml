[package]
name = "eve-tool-desktop"
version = "1.0.13"
description = "EVE 辅助工具桌面版 / 安卓版"
edition = "2021"

[lib]
name = "eve_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# 只在桌面系统用：单实例、记住窗口状态、自动更新（及更新提示对话框）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

# 本地红名截 EVE 窗口（capture.rs）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

# thin LTO + 默认 16 个代码生成单元：比全量 LTO + 单线程编译快很多，安装包只大一点（壳程序只开一个窗口，运行速度没区别）
[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
