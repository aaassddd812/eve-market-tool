# 桌面版（Windows）与安卓版：编译安装包、下载器与 APK，发布到公开仓库 aaassddd812/eve-tool-desktop 的 Releases
# 触发：推送标签 desktop-v1.2.3（版本号取自标签），或在 Actions 页手动运行（版本号取自 tauri.conf.json）
# 需要仓库 Secret：
#   RELEASE_TOKEN               对 eve-tool-desktop 有 Contents 读写权限的 Fine-grained token
#   ANDROID_KEYSTORE_B64        安卓签名密钥（jks 文件的 base64）
#   ANDROID_KEYSTORE_PASSWORD   密钥库与密钥的密码（别名 eve-tool）
# 一个平台失败时另一个照样发布
name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

env:
  RELEASE_REPO: aaassddd812/eve-tool-desktop

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 版本号
        id: ver
        shell: bash
        run: bash desktop/set-version.sh

      - name: 编译安装包
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis

      - name: 编译下载器
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /out:EVE-Tool-Downloader.exe /win32icon:desktop\src-tauri\icons\icon.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll (Resolve-Path "desktop/downloader/Downloader.cs")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/EVE-Tool-Setup.exe
          Copy-Item EVE-Tool-Downloader.exe out/
          Get-ChildItem out | ForEach-Object { "{0}  {1:N0} bytes  sha256 {2}" -f $_.Name, $_.Length, (Get-FileHash $_.FullName).Hash }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 版本号
        id: ver
        run: bash desktop/set-version.sh

      # 安卓的 Gradle 工程会反过来调用 Tauri CLI：用 cargo 安装的 CLI 生成工程，Gradle 就走 `cargo tauri`，不依赖 package.json
      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 编译 APK
        working-directory: desktop
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android init --ci
          cargo tauri icon src-tauri/icons/icon.png
          cargo tauri android build --apk --target aarch64 --target armv7 --ci

      - name: 签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find desktop/src-tauri/gen/android -name '*release-unsigned.apk' | head -1)
          echo "unsigned: $APK"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:KS_PASS --ks-key-alias eve-tool --key-pass env:KS_PASS --out out/EVE-Tool.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/EVE-Tool.apk
          rm -f "$RUNNER_TEMP/ks.jks"
          ls -la out; sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    needs: [windows, android]
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - name: 发布到公开仓库
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.windows.outputs.version || needs.android.outputs.version }}
          target_commitish: main
          name: EVE 辅助工具 ${{ needs.windows.outputs.version || needs.android.outputs.version }}
          body: |
            - Windows 10 / 11：下载 **EVE-Tool-Setup.exe** 直接安装，或用网站上的下载器（EVE-Tool-Downloader.exe）自动下载安装。
            - 安卓：下载 **EVE-Tool.apk** 安装（需要允许「安装未知来源应用」）。
          files: out/*
          make_latest: true
