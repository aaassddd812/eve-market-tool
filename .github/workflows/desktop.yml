# 桌面版：在 Windows 上编译 Tauri 安装包与下载器，发布到公开仓库 wbw5780/eve-tool-desktop 的 Releases
# 触发：推送标签 desktop-v1.2.3（版本号取自标签），或在 Actions 页手动运行（版本号取自 tauri.conf.json）
# 需要仓库 Secret：RELEASE_TOKEN（对 eve-tool-desktop 有 Contents 读写权限的 Fine-grained token）
name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

env:
  RELEASE_REPO: wbw5780/eve-tool-desktop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = $conf.version
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME -replace '^desktop-v', '' }
          (Get-Content desktop/src-tauri/tauri.conf.json -Raw) -replace '"version": "[^"]+"', ('"version": "' + $v + '"') | Set-Content desktop/src-tauri/tauri.conf.json -Encoding utf8NoBOM
          (Get-Content desktop/src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]+"', ('version = "' + $v + '"') | Set-Content desktop/src-tauri/Cargo.toml -Encoding utf8NoBOM
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 编译安装包
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis

      - name: 编译下载器
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /out:EVE-Tool-Downloader.exe /win32icon:desktop/src-tauri/icons/icon.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll desktop/downloader/Downloader.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/EVE-Tool-Setup.exe
          Copy-Item EVE-Tool-Downloader.exe out/
          Get-ChildItem out | ForEach-Object { "{0}  {1:N0} bytes  sha256 {2}" -f $_.Name, $_.Length, (Get-FileHash $_.FullName).Hash }

      - uses: actions/upload-artifact@v4
        with:
          name: eve-tool-desktop-${{ steps.ver.outputs.version }}
          path: out/*

      - name: 发布到公开仓库
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: main
          name: EVE 辅助工具 ${{ steps.ver.outputs.version }}
          body: |
            Windows 10 / 11 桌面版。下载 **EVE-Tool-Setup.exe** 直接安装，或用网站上的下载器（EVE-Tool-Downloader.exe）自动下载安装。
          files: out/*
          make_latest: true
