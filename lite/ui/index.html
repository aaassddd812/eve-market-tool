<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVE 收益助手</title>
  <link rel="stylesheet" href="fonts/misans/MiSansVF.min.css">
  <link rel="stylesheet" href="fonts/smiley/smiley-sans.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><img class="logo" src="https://images.evetech.net/types/44992/icon?size=64" alt=""><span>EVE 收益助手</span></div>
      <nav class="nav" id="nav">
        <button data-view="overview" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>角色概览</span></button>
        <button data-view="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>技能</span></button>
        <button data-view="wallet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/><path d="M6 6V5a2 2 0 0 1 2-2h8"/></svg><span>钱包与刷怪</span></button>
        <button data-view="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg><span>实时收益</span></button>
        <button data-view="abyss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 10-9 10-9-10z"/><path d="M12 7l4.5 5-4.5 5-4.5-5z"/></svg><span>深渊收益</span></button>
        <button data-view="assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span>资产</span></button>
        <button data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5"/><path d="M17 20V4M17 20l-3.5-3.5M17 20l3.5-3.5"/></svg><span>订单</span></button>
      </nav>
      <div class="side-foot">
        <label class="server-pick">服务器
          <select id="serverSel"></select>
        </label>
        <div class="muted small" id="appVer"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="chars" id="chars"></div>
        <button class="btn" id="addChar">＋ 添加角色</button>
        <button class="btn ghost" id="refreshBtn" title="重新读取当前页面">刷新</button>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <dialog class="modal" id="loginDlg">
    <form method="dialog" class="modal-box">
      <h3>添加角色</h3>
      <ol class="steps">
        <li>点「打开登录页」，在浏览器里登录 EVE 账号并选择角色、授权。</li>
        <li>授权后浏览器会停在一个空白页，<b>复制地址栏的完整地址</b>。</li>
        <li>粘贴到下面，点「完成」。</li>
      </ol>
      <div class="row"><button type="button" class="btn" id="openLogin">打开登录页</button><span class="muted small" id="loginHint"></span></div>
      <textarea id="callbackInput" rows="3" placeholder="https://…?code=…&state=…"></textarea>
      <p class="err" id="loginErr"></p>
      <div class="row end">
        <button type="button" class="btn ghost" value="cancel" id="loginCancel">取消</button>
        <button type="button" class="btn primary" id="loginDone">完成</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" hidden></div>
  <script src="js/mock.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
