[package]
name = "eve-lite"
version = "0.1.0"
description = "EVE 收益助手：ESI 角色 / 钱包 / 资产 / 订单、刷怪收益、深渊收益（界面打包在程序里）"
edition = "2021"

[lib]
name = "eve_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 界面里的网络请求（ESI、EVE 登录、本站价格）由程序代发，不受浏览器跨域限制；能访问的地址在 capabilities/default.json 里列出
# TLS 用系统自带的（Windows 上是 SChannel），不编译 ring
tauri-plugin-http = { version = "2", default-features = false, features = ["native-tls", "charset", "http2"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# 剪贴板序号与读取（clip.rs）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
